# Production stack, deployed as a Coolify "Docker Compose" resource from GitHub.
# Coolify fills every ${VAR} below from the resource's Environment Variables tab and
# routes radar.wavedidwhat.com to `api:8080`. Postgres and Redis publish no ports.
# (docker-compose.rdk.yml is the dev/preview variant for `rdk up`.)

x-app-env: &app-env
  NODE_ENV: production
  PORT: "8080"
  PUBLIC_URL: ${PUBLIC_URL:-https://radar.wavedidwhat.com}
  DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@radar-db:5432/radar
  REDIS_URL: redis://radar-redis:6379
  MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
  DASHBOARD_TOKEN: ${DASHBOARD_TOKEN}
  DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
  TOKEN_ENC_KEY: ${TOKEN_ENC_KEY}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  PRIMARY_ACCOUNT_EMAIL: ${PRIMARY_ACCOUNT_EMAIL:-}
  JOB_TRACKER_SHEET_ID: ${JOB_TRACKER_SHEET_ID:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-anthropic/claude-haiku-5.5}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  SENDING_ENABLED: ${SENDING_ENABLED:-false}

services:
  migrate:
    build: { context: ., dockerfile: Dockerfile }
    restart: "no"
    command: ["node", "dist/db/migrate.js"]
    environment: *app-env
    depends_on:
      radar-db: { condition: service_healthy }
    labels:
      - coolify.exclude_from_hc=true

  api:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["node", "dist/api/index.js"]
    environment: *app-env
    expose: ["8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      radar-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    command: ["node", "dist/worker/index.js"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      radar-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s

  radar-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_DB: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [radar-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 20

  radar-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [radar-redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly pg_dump at ~03:00 UTC, named by weekday so a week rotates by overwriting.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [radar-backups:/backups]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( (86400 + 3*3600 - $$(date +%s) % 86400) % 86400 + 60 ))
          pg_dump -h radar-db -U radar -d radar -Fc -f /backups/radar-$$(date +%a).dump && echo "backup ok"
        done
    depends_on:
      radar-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "radar-db", "-U", "radar"]
      interval: 60s

volumes:
  radar-pg:
  radar-redis:
  radar-backups:
